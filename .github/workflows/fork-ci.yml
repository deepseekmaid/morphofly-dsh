# Fork CI: verification for the personal distribution's `custom` trunk.
#
# The inherited upstream workflows (ci.yml, ci-master.yml, ...) target enterprise
# and self-hosted runners plus keyed jobs, so they stay disabled in this fork;
# this workflow is the fork's own gate. It needs no repository secrets and runs
# on standard GitHub-hosted runners.
name: Fork CI

on:
  push:
    branches: [custom]
  pull_request:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked into
  # apps/cli/cordis.yml.
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Static gates (typecheck, lint, docs, module graph, policies)
        run: pnpm run check:ci:static

  unit:
    name: unit tests (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # A few suites need capabilities standard hosted runners lack (kernel
    # confinement, gh timing, git-worktree timing); upstream runs them on its
    # enterprise and self-hosted matrix. This lane still surfaces unit
    # regressions, but the blocking verdict comes from the static and build
    # jobs so a capability gap never hides a real code failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      # Standard GitHub-hosted runners lack the kernel confinement, gh, and
      # git-worktree timing that a few suites assume, so those run in the
      # upstream CI matrix instead. The rest of the unit suite runs with
      # generous timeouts and retries because this fork does not buy the
      # 16-core enterprise runners upstream uses.
      - name: Build the native system addon
        run: pnpm run build:native-system
      - name: Unit suite
        run: |
          pnpm exec vitest run \
            --testTimeout=30000 \
            --hookTimeout=120000 \
            --retry=2 \
            --exclude 'packages/sandbox/**' \
            --exclude 'packages/ptc-runtime/ptc-runtime-node/**' \
            --exclude 'packages/workflow/workflow-ptc/**' \
            --exclude 'packages/experimental/client-ui-forge/**' \
            --exclude 'packages/experimental/forge-github/**'

  build:
    name: build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build package artifacts and the Web bundle
        run: pnpm run build:artifacts
      - name: Type-check aggregate tests and scripts against the build
        run: pnpm run build:check
